apiVersion: apps/v1
kind: Deployment
metadata:
  name: fedora
  labels:
    app: fedora
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fedora
  template:
    metadata:
      labels:
        app: fedora
    spec:
      containers:
      - env:
        - name: USER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fedora-credentials
              key: user-password
        - name: ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fedora-credentials
              key: root-password
        image: ghcr.io/koxt2/fedora:latest
        name: fedora
        ports:
        - containerPort: 22
          hostPort: 2222
        securityContext:
          privileged: true
        tty: true
        volumeMounts:
        - mountPath: /home/user
          name: home
      volumes:
      - hostPath:
          path: /home/server/storage/fedora/home
          type: Directory
        name: home

---

apiVersion: v1
kind: Secret
metadata:
  name: fedora-credentials
type: Opaque
stringData:
  user-password: change-me-user
  root-password: change-me-root

---

apiVersion: v1
kind: Service
metadata:
  name: fedora-ssh
spec:
  type: NodePort
  selector:
    app: fedora
  ports:
  - name: ssh
    port: 22
    targetPort: 22
    nodePort: 30022
